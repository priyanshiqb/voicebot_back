components:
  schemas:
    Agent:
      type: object
      description: |-
        Audited Tenant-scoped Base Model Serializer.
        Combines TenantBaseModelCoreSerializer's hybrid tenant references with BaseModelSerializer's
        audited user tracking nested lists (created_by, updated_by, deleted_by).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
        bot_name:
          type: string
          description: Name of the bot.
          pattern: ^[\w\s-]+$
          maxLength: 100
          minLength: 2
        persona_name:
          type: string
          description: Name of the persona the bot adopts.
          pattern: ^[\w\s-]+$
          maxLength: 100
          minLength: 2
        languages:
          description: List of languages supported by the agent (e.g., ['en-IN']).
        tone:
          allOf:
          - $ref: '#/components/schemas/ToneEnum'
          description: |-
            Tone of the agent interaction.

            * `PROFESSIONAL` - Professional
            * `FRIENDLY` - Friendly
            * `FORMAL` - Formal
            * `CASUAL` - Casual
            * `ENTHUSIASTIC` - Enthusiastic
        agent_template:
          type: string
          format: uuid
          nullable: true
        voice_name:
          type: string
          nullable: true
          description: Identifier for the chosen agent voice.
          maxLength: 100
        knowledge_bases:
          type: array
          items:
            type: string
            format: uuid
            nullable: true
          readOnly: true
        add_knowledge_bases:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        remove_knowledge_bases:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        probing_questions:
          type: array
          items:
            type: string
            format: uuid
            nullable: true
          readOnly: true
        add_probing_questions:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        remove_probing_questions:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        transfer_destinations:
          nullable: true
          description: Upcoming - Transfer configurations and destinations.
        created_by:
          type: string
          format: uuid
          readOnly: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
        deleted_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - bot_name
      - created_at
      - created_by
      - deleted_at
      - deleted_by
      - id
      - knowledge_bases
      - persona_name
      - probing_questions
      - tenant
      - updated_at
      - updated_by
    AgentDropdown:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
          format: uuid
      required:
      - label
      - value
    AgentList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        bot_name:
          type: string
          description: Name of the bot.
          pattern: ^[\w\s-]+$
          maxLength: 100
          minLength: 2
        persona_name:
          type: string
          description: Name of the persona the bot adopts.
          pattern: ^[\w\s-]+$
          maxLength: 100
          minLength: 2
        tone:
          allOf:
          - $ref: '#/components/schemas/ToneEnum'
          description: |-
            Tone of the agent interaction.

            * `PROFESSIONAL` - Professional
            * `FRIENDLY` - Friendly
            * `FORMAL` - Formal
            * `CASUAL` - Casual
            * `ENTHUSIASTIC` - Enthusiastic
        agent_template:
          allOf:
          - $ref: '#/components/schemas/AgentTemplateRef'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_template
      - bot_name
      - created_at
      - id
      - persona_name
    AgentTemplate:
      type: object
      description: |-
        Audited Tenant-scoped Base Model Serializer.
        Combines TenantBaseModelCoreSerializer's hybrid tenant references with BaseModelSerializer's
        audited user tracking nested lists (created_by, updated_by, deleted_by).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Name of the template (e.g., 'Wealth Management Advisor').
          pattern: ^[\w\s-]+$
          maxLength: 100
          minLength: 2
        short_description:
          type: string
          description: Brief description of what the bot does and who it helps.
          minLength: 10
          maxLength: 300
        visual_icon:
          type: string
          nullable: true
          description: Predefined visual icon representing the template.
          maxLength: 50
        primary_accent:
          type: string
          nullable: true
          description: Accent color code (hex) for template cards and highlights.
          maxLength: 7
        agent_prompt:
          type: string
          description: Core instruction prompt defining personality, constraints,
            and behavior.
          minLength: 30
          maxLength: 5000
        industry:
          allOf:
          - $ref: '#/components/schemas/IndustryEnum'
          description: |-
            Selected industry category for the template.

            * `CLINIC_RECEPTIONIST` - Clinic Receptionist
            * `AGRICULTURAL_SUPPLIER` - Agricultural Supplier
            * `REAL_ESTATE` - Real Estate
            * `E_COMMERCE` - E-Commerce
            * `RESTAURANT` - Restaurant
