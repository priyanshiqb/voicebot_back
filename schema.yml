            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
    post:
      operationId: v1_core_knowledge_base_create
      description: "\n        ### Complete payload schemas & constraints per component
        type:\n        \n        1. **Texts (`texts` array)**:\n           * `title`
        (string, **Required**): The main heading/title for this text block (Max 255
        characters).\n           * `description` (string, Optional): The detailed
        text content or guidelines body.\n        \n        2. **Files (`files` array)**:\n
        \          * `id` (UUID, **Required**): The UUID of the pre-uploaded document
        file (uploaded via `POST /api/v1/core/knowledge-base/upload_file/`).\n        \n
        \       3. **Websites (`websites` array)**:\n           * `url` (string, **Required**):
        Valid domain crawling target webpage URL. Scoped uniquely per tenant to prevent
        crawlers duplication.\n        \n        4. **Question Answers (`question_answers`
        array)**:\n           * `answer` (string, **Required**): The primary answer
        block to return for associated queries.\n           * `questions` (array of
        dicts, Optional): List of associated trigger question variations.\n             *
        `question` (string, **Required**): Individual variation phrasing of the question.\n
        \       "
      summary: Create a new Knowledge Base
      tags:
      - Knowledge Base
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBase'
            examples:
              NestedCreationPayloadExample:
                value:
                  name: Acme Setup Guides
                  texts:
                  - title: Config Instructions
                    description: Configure API credentials.
                  files:
                  - id: uuid-preuploaded-file-id
                  websites:
                  - url: https://acme-setup.org/faq
                  question_answers:
                  - answer: Yes, standard deep nested structures are supported.
                    questions:
                    - question: Is nested creation supported?
                summary: Nested Creation Payload Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KnowledgeBase'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KnowledgeBase'
        required: true
      security:
      - jwt: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
              examples:
                SuccessfulCreationResponseExample:
                  value:
                    status: true
                    message: Created successfully
                    data:
                      id: e4b2d561-71fb-48eb-bf2e-0a5682855cf8
                      tenant: uuid-tenant-id
                      name: Acme Setup Guides
                      texts:
                      - id: uuid-text-1
                        title: Config Instructions
                        description: Configure API credentials.
                      files:
                      - id: uuid-preuploaded-file-id
                        original_name: setup.pdf
                      websites:
                      - id: uuid-web-1
                        url: https://acme-setup.org/faq
                      question_answers:
                      - id: uuid-qa-1
                        answer: Yes, standard deep nested structures are supported.
                        questions:
                        - id: uuid-q-1
                          question: Is nested creation supported?
                      is_processed: false
                      processing_status: PENDING
                    errors: null
                  summary: Successful Creation Response Example
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
