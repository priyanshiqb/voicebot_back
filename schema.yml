    put:
      operationId: v1_core_knowledge_base_update
      description: "\n        Performs a full update on the Knowledge Base.\n        Supports
        explicit, granular transactional operations on M2M lists using the `\"flag\"`
        parameter:\n        * **`create`**: Instantiates and links a new record (requires
        necessary fields).\n        * **`update`**: Updates the existing record in-place
        by `id`.\n        * **`delete`**: Safely soft-deletes and disassociates the
        record by `id`.\n        * **No Flag Fallback**: Keeps the record associated
        and unchanged.\n        "
      summary: Update a Knowledge Base (PUT)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Knowledge Base.
        required: true
      tags:
      - Knowledge Base
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBase'
            examples:
              PUTFlag-basedUpdatePayloadExample:
                value:
                  name: Acme Updated Guides
