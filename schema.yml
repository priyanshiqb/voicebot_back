openapi: 3.0.3
info:
  title: Voicebot Backend API
  version: 1.0.0
  description: Enterprise production REST API for the Voicebot platform.
paths:
  /api/v1/auth/forgot-password/:
    post:
      operationId: v1_auth_forgot_password_create
      description: Initiates password reset for active onboarded users by emailing
        a 6-digit verification OTP valid for 2 minutes.
      summary: 'Step 1: Forgot Onboarded User Password'
      tags:
      - Auth - Password Reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserForgotPassword'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: OTP generation flow initiated successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation error.
  /api/v1/auth/forgot-password/resend/:
    post:
      operationId: v1_auth_forgot_password_resend_create
      description: Resends a new 6-digit OTP to the active onboarded user's email,
        subject to a 30-second cooldown period.
      summary: 'Step 1 Helper: Resend Onboarded User Forgot Password OTP'
      tags:
      - Auth - Password Reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserForgotPasswordResendOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserForgotPasswordResendOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserForgotPasswordResendOTP'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: A new verification OTP has been emailed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation, User not found, or OTP Cooldown active.
  /api/v1/auth/forgot-password/verify/:
    post:
      operationId: v1_auth_forgot_password_verify_create
      description: Verifies the emailed 6-digit OTP. Upon successful verification,
        invalidates the OTP and returns a secure temporary signed reset token.
      summary: 'Step 2: Verify Onboarded User OTP'
      tags:
      - Auth - Password Reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserForgotPasswordVerifyOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserForgotPasswordVerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserForgotPasswordVerifyOTP'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: OTP verified successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation or OTP error.
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - Auth - Access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Login successful
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation failed, invalid email/password.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Account or IP locked due to too many failed login attempts.
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - Auth - Access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Logout successful
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Invalid or missing refresh token.
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      tags:
      - Auth - Access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: Token refreshed successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Invalid or missing refresh token, or inactive/deleted user
            account.
  /api/v1/auth/reset-password/:
    post:
      operationId: v1_auth_reset_password_create
      description: Accepts the temporary signed reset token and user ID to perform
        password updates, guaranteeing single-use token lifecycle.
      summary: 'Step 3: Reset Onboarded User Password'
      tags:
      - Auth - Password Reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserResetPassword'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Password reset successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation or Token error.
  /api/v1/auth/sessions/:
    get:
      operationId: v1_auth_sessions_list
      description: ViewSet to manage user sessions/devices.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserSessionListList'
          description: ''
    post:
      operationId: v1_auth_sessions_create
      description: ViewSet to manage user sessions/devices.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserSession'
        required: true
      security:
      - jwt: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
          description: ''
  /api/v1/auth/sessions/{id}/:
    get:
      operationId: v1_auth_sessions_retrieve
      description: ViewSet to manage user sessions/devices.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this User Session.
        required: true
      tags:
      - v1
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
          description: ''
    delete:
      operationId: v1_auth_sessions_destroy
      description: ViewSet to manage user sessions/devices.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this User Session.
        required: true
      tags:
      - v1
      security:
      - jwt: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/sessions/bulk_delete/:
    post:
      operationId: v1_auth_sessions_bulk_delete_create
      description: ViewSet to manage user sessions/devices.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              example:
                ids:
                - uuid-1
                - uuid-2
      security:
      - jwt: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/sessions/dropdown/:
    get:
      operationId: v1_auth_sessions_dropdown_retrieve
      description: ViewSet to manage user sessions/devices.
      tags:
      - v1
      security:
      - jwt: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/sessions/revoke-all/:
    post:
      operationId: v1_auth_sessions_revoke_all_create
      description: Revoke all other active sessions except the current one.
      tags:
      - v1
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: All other sessions revoked successfully
  /api/v1/auth/users/:
    get:
      operationId: v1_auth_users_list
      description: Get paginated list of users.
      summary: List Users
      parameters:
      - in: query
        name: created_at__date
        schema:
          type: string
          format: date
      - in: query
        name: created_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - Users
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserListList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
    post:
      operationId: v1_auth_users_create
      description: Create a new user.
      summary: Create User
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwt: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
  /api/v1/auth/users/{id}/:
    get:
      operationId: v1_auth_users_retrieve
      description: Get specific user details by ID.
      summary: Get User
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - Users
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: User not found.
    put:
      operationId: v1_auth_users_update
      description: Completely update an existing user by ID.
      summary: Update User
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: User not found.
    patch:
      operationId: v1_auth_users_partial_update
      description: Partially update an existing user by ID.
      summary: Partial Update User
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: User not found.
    delete:
      operationId: v1_auth_users_destroy
      description: Soft-delete an existing user by ID.
      summary: Delete User
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - Users
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: User deleted successfully.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: User not found.
  /api/v1/auth/users/bulk_delete/:
    post:
      operationId: v1_auth_users_bulk_delete_create
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              example:
                ids:
                - uuid-1
                - uuid-2
      security:
      - jwt: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/users/change-password/:
    post:
      operationId: v1_auth_users_change_password_create
      description: Allows an authenticated user to change their password.
      summary: Change Password
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Password changed successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Validation errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
  /api/v1/auth/users/dropdown/:
    get:
      operationId: v1_auth_users_dropdown_retrieve
      tags:
      - Users
      security:
      - jwt: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/users/me/:
    get:
      operationId: v1_auth_users_me_retrieve
      description: Get details of the currently authenticated user.
      summary: Get Current User
      tags:
      - Users
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
  /api/v1/core/agent-templates/:
    get:
      operationId: v1_core_agent_templates_list
      description: Get paginated list of agent templates under the active tenant context.
      summary: List Agent Templates
      parameters:
      - in: query
        name: can_user_edit_flow
        schema:
          type: boolean
      - in: query
        name: industry
        schema:
          type: string
          enum:
          - AGRICULTURAL_SUPPLIER
          - CLINIC_RECEPTIONIST
          - E_COMMERCE
          - GENERAL_ASSISTANT
          - OTHER
          - REAL_ESTATE
          - RESTAURANT
        description: |-
          Selected industry category for the template.

          * `CLINIC_RECEPTIONIST` - Clinic Receptionist
          * `AGRICULTURAL_SUPPLIER` - Agricultural Supplier
          * `REAL_ESTATE` - Real Estate
          * `E_COMMERCE` - E-Commerce
          * `RESTAURANT` - Restaurant
          * `GENERAL_ASSISTANT` - General Assistant
          * `OTHER` - Other
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_default
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: strict_facts
        schema:
          type: boolean
      tags:
      - Agent Template
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentTemplateListList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
    post:
      operationId: v1_core_agent_templates_create
      description: Create a new agent template under the active tenant context.
      summary: Create Agent Template
      tags:
      - Agent Template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTemplate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentTemplate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentTemplate'
        required: true
      security:
      - jwt: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTemplate'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Invalid input values or validation error.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
  /api/v1/core/agent-templates/{id}/:
    get:
      operationId: v1_core_agent_templates_retrieve
      description: Get specific agent template details by ID.
      summary: Get Agent Template
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Agent Template.
        required: true
      tags:
      - Agent Template
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTemplate'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Unauthenticated user request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
          description: Permission denied.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
