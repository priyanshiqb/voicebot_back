services:
  # 8. Grafana Dashboard UI
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-voicebot
    profiles:
      - grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_LOG_LEVEL=warn
    ports:
      - "${GRAFANA_BIND_IP:-${BIND_IP}}:${GRAFANA_PORT}:3000"
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ../.data/grafana:/var/lib/grafana
      - ../docker-config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../docker-config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ../docker-config/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9. Grafana Loki (Log Aggregator)
  #
  # The Loki image is distroless: /usr/bin/loki and nothing else, no shell or wget,
  # and Loki has no self-probe flag. probe-tools below drops a static busybox into
  # a shared volume so the healthcheck has a wget to run.
  #
  # Not a `type: image` mount of busybox, which would be simpler: under the
  # containerd image store, compose hands the engine an image ID it cannot resolve
  # once the image is already local, so every redeploy after the first fails with
  # "No such image: sha256:...".
  loki:
    image: grafana/loki:latest
    container_name: loki-voicebot
    profiles:
      - logs-monitoring
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-720h}
    volumes:
      - ../docker-config/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ../.data/loki:/loki
      - probe-tools:/probe:ro
    depends_on:
      probe-tools:
        condition: service_completed_successfully
    ports:
      - "${LOKI_BIND_IP:-${BIND_IP}}:${LOKI_PORT}:3100"
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9a. One-shot: copies busybox into the volume that the healthchecks of shell-less
  # images (loki, redis-exporter) run it from. Exits 0 immediately; `docker ps -a`
  # shows it as Exited (0), which is expected. One profile per consumer, so it runs
  # whenever either is enabled. Must be the -musl variant: plain busybox is linked
  # against glibc, which those images lack, so it fails with "no such file or
  # directory".
  probe-tools:
    image: busybox:stable-musl
    container_name: probe-tools-voicebot
    profiles:
      - logs-monitoring
      - redis-exporter
    command: ["cp", "/bin/busybox", "/probe/busybox"]
    volumes:
      - probe-tools:/probe
    restart: "no"

  # 9b. Grafana Alloy (Log Collector & Shipper)
  #
  # Replaced Promtail, which reached end of life on 2026-03-02 and gets no further
  # fixes — its `:latest` tag stopped moving at 3.6.8. Pinned rather than :latest for
  # the same reason: a tag that silently stops updating looks current and is not.
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy-voicebot
    profiles:
      - logs-monitoring
    # The image CMD is `run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data`,
    # restated here only to add the listen address. Alloy binds its HTTP server to
    # 127.0.0.1 by default, which inside a container means nothing else can reach its
    # UI or /metrics. Still not published to the host.
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ../docker-config/alloy-config.alloy:/etc/alloy/config.alloy:ro
      # Read positions live here. Promtail kept them in /tmp, so every container
      # recreate lost its place in each log stream.
      - ../.data/alloy:/var/lib/alloy/data
      # Needed for container discovery and log tailing. `:ro` protects only the socket
      # file — the Docker API behind it stays fully usable, so this container is
      # root-equivalent on the host. Keep the image patched.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    # The image has bash but no curl or wget, so the probe speaks HTTP over bash's
    # /dev/tcp. It checks the status line because Alloy's UI answers 200 for any path.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 10. Prometheus Time-Series Database
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-voicebot
    profiles:
      - matrics-monitoring
    volumes:
      - ../docker-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../docker-config/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ../.data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Explicit rather than relying on the 15d default, and size-capped so a busy
      # period cannot fill the disk. Whichever limit is hit first wins.
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=8GB'
      # Allows `curl -XPOST .../-/reload`, but that only helps for edits made IN
      # PLACE. The two config files above are single-file bind mounts, which pin
      # the file's inode: `git pull` writes a new file and renames it over the old
      # one, so a running container keeps reading the old version and a reload
      # re-reads stale config without error. After a pull, `docker compose restart
      # prometheus` instead; a restart re-resolves the mounts.
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_BIND_IP:-${BIND_IP}}:${PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 10b. Alertmanager - delivers Prometheus alerts by email and/or Telegram
  #
  # Same profile as Prometheus, so it always has somewhere to send alerts. Which
  # channels are live is decided at start from .env (see .env.example 1.8 and
  # docker-config/alertmanager/start.sh); with none set, alerts are dropped, so a
  # dev box running this profile sends nothing.
  #
  # Only the variables the config needs are passed, not env_file: this container
  # has no business holding the Django secret key or payment credentials.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-voicebot
    profiles:
      - matrics-monitoring
    entrypoint: ["/bin/sh", "/etc/alertmanager/voicebot/start.sh"]
    environment:
      ALERT_ENV_NAME: ${ALERT_ENV_NAME:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-}
      ALERT_SMTP_USE_TLS: ${ALERT_SMTP_USE_TLS:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - ../docker-config/alertmanager:/etc/alertmanager/voicebot:ro
      # Silences and the notification log, so a restart neither forgets an active
      # silence nor re-sends everything already delivered. A named volume, not
      # ../.data: it inherits the image's nobody ownership of /alertmanager.
      - alertmanager-data:/alertmanager
    # The rendered config and the secret files it points at live only in memory.
    tmpfs:
      - /tmp/alertmanager:mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 11. cAdvisor - per-container CPU, memory, network and disk
  #
  # Privileged and mounting the Docker root: that is what reading every container's
  # cgroup accounting requires, and it makes this container root-equivalent on the
  # host, same caveat as alloy above. Not published to the host; Prometheus reaches
  # it over the backend network.
  #
  # The version pin is load-bearing in both directions.
  #
  # Floor: this host's Docker uses the containerd image store, which reports its
  # storage driver as "overlayfs", not "overlay2". Older cAdvisor has no such
  # constant, so it fell through to the legacy
  # /var/lib/docker/image/<driver>/layerdb lookup, failed to resolve a read-write
  # layer for every container, and exported zero container metrics while looking
  # perfectly healthy. v0.52.1 is known bad; v0.55.1 carries
  # ContainerdSnapshotterStorageDriver = "overlayfs" and resolves each rootfs
  # through containerd's API instead.
  #
  # Ceiling: v0.55.1 is the newest tag published to gcr.io. cAdvisor kept cutting
  # GitHub releases past it (v0.60.x exists upstream) without pushing them here, so
  # a "newer" tag resolves to nothing and the pull fails outright.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor-voicebot
    profiles:
      - host-metrics
    command:
      # Ignore the host's own cgroups; this stack only cares about containers.
      - '--docker_only=true'
      # Matches prometheus.yml's scrape_interval. The 1s default burns noticeable CPU
      # on a box this size for samples nothing reads.
      - '--housekeeping_interval=15s'
      # Container labels become metric labels otherwise, which on a compose project
      # multiplies series count for no benefit.
      - '--store_container_labels=false'
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Explicit, even though /sys above nominally covers it. On cgroup v2 hosts the
      # unified hierarchy is its own mount and cAdvisor reports zero container metrics
      # without seeing it directly -- the symptom is a running, healthy-looking
      # container that exports only machine-level series.
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      # Required by the overlayfs path above: cAdvisor resolves each container's
      # rootfs through containerd's API in the "moby" namespace instead of reading
      # Docker's layer database. Without this socket it cannot build a client and
      # falls back to reporting nothing per container.
      - /run/containerd:/run/containerd:ro
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 12. node-exporter - host CPU, memory, disk and network
  #
  # pid: host and the three read-only host mounts are the standard arrangement; without
  # them the exporter reports the container's own namespace instead of the machine's.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-voicebot
    profiles:
      - host-metrics
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      # Strips this prefix from reported mountpoints, so the host root shows up as "/"
      # rather than "/host/root". Dashboard queries depend on that.
      - '--path.rootfs=/host/root'
      # Docker's overlay and container mounts otherwise appear as hundreds of
      # near-duplicate filesystems.
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|securityfs|sysfs|tracefs)$$'
      # Serves docker-state's per-container restart / running / health metrics.
      - '--collector.textfile.directory=/textfile'
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - docker-state-textfile:/textfile:ro
    # The landing page, not /metrics: a scrape walks every collector.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 13. docker-state - Docker's own per-container restart count, running state and
  # healthcheck status, which cadvisor cannot provide
  #
  # Every 15s it asks the Docker API and writes the result as a metrics file that
  # node-exporter serves (--collector.textfile.directory above), so there is no new
  # endpoint to scrape. Feeds ContainerRestartLoop, ContainerUnhealthy and
  # ContainerNotRunning. See docker-config/docker-state/collect.sh.
  #
  # The official Docker CLI image rather than a third-party exporter: the CLI
  # negotiates the API version with the daemon, and Docker 29 stopped serving the
  # old API versions that unmaintained exporters pin.
  #
  # `:ro` on the socket protects only the socket file; the Docker API behind it
  # stays fully usable, so this container is root-equivalent on the host, same
  # caveat as alloy and cadvisor.
  docker-state:
    image: docker:cli
    container_name: docker-state-voicebot
    profiles:
      - host-metrics
    entrypoint: ["/bin/sh", "/etc/docker-state/collect.sh"]
    volumes:
      - ../docker-config/docker-state:/etc/docker-state:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-state-textfile:/textfile
    # Unhealthy once the file is more than a minute old, i.e. the loop has stalled.
    healthcheck:
      test: ["CMD-SHELL", "find /textfile -name docker_state.prom -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 14. celery-exporter - Celery task and worker metrics from the event stream
  #
  # Subscribes to the task events and heartbeats the workers publish through the
  # broker (CELERY_WORKER_SEND_TASK_EVENTS in config/settings/base.py) and serves
  # them as Prometheus counters: tasks sent/received/started/succeeded/failed/
  # retried by task name, a runtime histogram, workers online and tasks active per
  # worker. Celery has no /metrics of its own.
  #
  # --worker-timeout 60: a worker counts as down after 60s without a heartbeat
  # (they arrive every 2s) instead of the default 300s, so CeleryNoWorkersOnline
  # fires in minutes. --queues celery makes the queue's series exist before a
  # worker is first seen. --buckets: the default runtime histogram stops at 10s,
  # but calendar syncs, campaign runs and ETL calls take minutes, and everything
  # past the last bucket reads as that bucket; these reach 30 minutes.
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: celery-exporter-voicebot
    profiles:
      - celery-exporter
    command:
      - --broker-url=${CELERY_BROKER_URL:-redis://redis:6379/2}
      - --worker-timeout=60
      - --queues=celery
      - --buckets=0.01,0.05,0.1,0.25,0.5,1,2.5,5,10,30,60,120,300,600,1800,inf
    depends_on:
      redis:
        condition: service_healthy
        required: false
    # The image has Python but no wget or curl. /health answers once the exporter
    # is connected to the broker.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:9808/health', timeout=4).status != 200)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Holds the static busybox probe-tools copies in; see the loki service.
  probe-tools:
  alertmanager-data:
  # docker-state writes, node-exporter reads.
  docker-state-textfile:
