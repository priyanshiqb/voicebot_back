services:
  # 8. Grafana Dashboard UI
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-voicebot
    profiles:
      - grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_LOG_LEVEL=warn
    ports:
      - "${GRAFANA_BIND_IP:-${BIND_IP}}:${GRAFANA_PORT}:3000"
    depends_on:
      - loki
    volumes:
      - ../.data/grafana:/var/lib/grafana
      - ../docker-config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../docker-config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ../docker-config/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9. Grafana Loki (Log Aggregator)
  loki:
    image: grafana/loki:latest
    container_name: loki-voicebot
    profiles:
      - logs-monitoring
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-720h}
    volumes:
      - ../docker-config/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ../.data/loki:/loki
    ports:
      - "${LOKI_BIND_IP:-${BIND_IP}}:${LOKI_PORT}:3100"
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9b. Grafana Alloy (Log Collector & Shipper)
  #
  # Replaced Promtail, which reached end of life on 2026-03-02 and gets no further
  # fixes — its `:latest` tag stopped moving at 3.6.8. Pinned rather than :latest for
  # the same reason: a tag that silently stops updating looks current and is not.
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy-voicebot
    profiles:
      - logs-monitoring
    # The image CMD is `run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data`,
    # restated here only to add the listen address. Alloy binds its HTTP server to
    # 127.0.0.1 by default, which inside a container means nothing else can reach its
    # UI or /metrics. Still not published to the host.
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ../docker-config/alloy-config.alloy:/etc/alloy/config.alloy:ro
      # Read positions live here. Promtail kept them in /tmp, so every container
      # recreate lost its place in each log stream.
      - ../.data/alloy:/var/lib/alloy/data
      # Needed for container discovery and log tailing. `:ro` protects only the socket
      # file — the Docker API behind it stays fully usable, so this container is
      # root-equivalent on the host. Keep the image patched.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 10. Prometheus Time-Series Database
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-voicebot
    profiles:
      - matrics-monitoring
    volumes:
      - ../docker-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../docker-config/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ../.data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Explicit rather than relying on the 15d default, and size-capped so a busy
      # period cannot fill the disk. Whichever limit is hit first wins.
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=8GB'
      # Allows `curl -XPOST .../-/reload` instead of restarting the container to pick
      # up prometheus.yml or alert-rules.yml changes.
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_BIND_IP:-${BIND_IP}}:${PROMETHEUS_PORT}:9090"
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 11. cAdvisor - per-container CPU, memory, network and disk
  #
  # Privileged and mounting the Docker root: that is what reading every container's
  # cgroup accounting requires, and it makes this container root-equivalent on the
  # host, same caveat as alloy above. Not published to the host; Prometheus reaches
  # it over the backend network.
  #
  # The version pin is load-bearing in both directions.
  #
  # Floor: this host's Docker uses the containerd image store, which reports its
  # storage driver as "overlayfs", not "overlay2". Older cAdvisor has no such
  # constant, so it fell through to the legacy
  # /var/lib/docker/image/<driver>/layerdb lookup, failed to resolve a read-write
  # layer for every container, and exported zero container metrics while looking
  # perfectly healthy. v0.52.1 is known bad; v0.55.1 carries
  # ContainerdSnapshotterStorageDriver = "overlayfs" and resolves each rootfs
  # through containerd's API instead.
  #
  # Ceiling: v0.55.1 is the newest tag published to gcr.io. cAdvisor kept cutting
  # GitHub releases past it (v0.60.x exists upstream) without pushing them here, so
  # a "newer" tag resolves to nothing and the pull fails outright.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor-voicebot
    profiles:
      - host-metrics
    command:
      # Ignore the host's own cgroups; this stack only cares about containers.
      - '--docker_only=true'
      # Matches prometheus.yml's scrape_interval. The 1s default burns noticeable CPU
      # on a box this size for samples nothing reads.
      - '--housekeeping_interval=15s'
      # Container labels become metric labels otherwise, which on a compose project
      # multiplies series count for no benefit.
      - '--store_container_labels=false'
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Explicit, even though /sys above nominally covers it. On cgroup v2 hosts the
      # unified hierarchy is its own mount and cAdvisor reports zero container metrics
      # without seeing it directly -- the symptom is a running, healthy-looking
      # container that exports only machine-level series.
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      # Required by the overlayfs path above: cAdvisor resolves each container's
      # rootfs through containerd's API in the "moby" namespace instead of reading
      # Docker's layer database. Without this socket it cannot build a client and
      # falls back to reporting nothing per container.
      - /run/containerd:/run/containerd:ro
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 12. node-exporter - host CPU, memory, disk and network
  #
  # pid: host and the three read-only host mounts are the standard arrangement; without
  # them the exporter reports the container's own namespace instead of the machine's.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-voicebot
    profiles:
      - host-metrics
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      # Strips this prefix from reported mountpoints, so the host root shows up as "/"
      # rather than "/host/root". Dashboard queries depend on that.
      - '--path.rootfs=/host/root'
      # Docker's overlay and container mounts otherwise appear as hundreds of
      # near-duplicate filesystems.
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|securityfs|sysfs|tracefs)$$'
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
