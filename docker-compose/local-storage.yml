services:
  # Azurite — local Azure Blob Storage emulator
  #
  # The local object store. `.env` section 2.8 points the app at it; the container
  # itself is not created automatically -- `az storage container create --name
  # voicebot-local --connection-string "$AZURE_CONNECTION_STRING"` once, after first
  # boot.
  #
  # Credentials are Azurite's built-in well-known development account and are not
  # configurable here on purpose:
  #     account : devstoreaccount1
  #     key     : Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
  # Every Azure tool recognises that pair, which is why it is left as the default
  # rather than wired to the app's variables. The cost is that app and emulator can
  # drift, which MinIO's reuse of S3_ACCESS_KEY_ID made impossible -- a 403 on upload
  # is usually .env section 2.8 disagreeing with the pair above. To mirror
  # a production account name instead, set AZURITE_ACCOUNTS in the environment as
  # "name:base64key" — an invalid base64 key makes the container exit at boot.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite-voicebot
    profiles:
      - emulators
    # Blob only. Nothing here uses queue or table storage, and each extra listener is
    # one more published port to collide with.
    #
    # --skipApiVersionCheck: azure-storage-blob ships new x-ms-version values faster
    # than Azurite adopts them, and the mismatch surfaces as an opaque 400 rather than
    # as "unsupported version".
    #
    # Deliberately NOT --loose. Loose mode stops enforcing required headers, so an
    # upload missing `x-ms-blob-type: BlockBlob` would succeed locally and fail against
    # real Azure — exactly the class of bug a local emulator exists to catch.
    command: >
      azurite-blob
      --blobHost 0.0.0.0
      --blobPort 10000
      --location /data
      --skipApiVersionCheck
    volumes:
      - ../.data/azurite:/data
    ports:
      - "${AZURITE_BIND_IP:-${BIND_IP}}:${AZURITE_BLOB_PORT:-10000}:10000"
    restart: always
    networks:
      - backend
    # node is the only interpreter guaranteed in this image — no curl, and busybox nc
    # here has no -z. A bare TCP connect is the check that does not depend on either.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      retries: 5
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
