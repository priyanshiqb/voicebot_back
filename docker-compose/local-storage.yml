services:
  # MinIO S3-Compatible Storage Emulator
  minio:
    image: minio/minio:latest
    container_name: minio-voicebot
    profiles:
      - emulators
    volumes:
      - ../.data/minio:/data
    ports:
      - "${MINIO_BIND_IP:-${BIND_IP}}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_IP:-${BIND_IP}}:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
