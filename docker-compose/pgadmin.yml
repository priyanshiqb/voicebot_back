services:
  # 5. Database Admin Web UI (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-voicebot
    profiles:
      - pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ../.data/pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_BIND_IP:-${BIND_IP}}:${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # First boot sets up its config DB and took ~35s in testing.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
