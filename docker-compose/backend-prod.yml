services:
  # 1. Production Django WSGI Server (Gunicorn)
  backend-wsgi:
    image: voicebot-backend-prod:latest
    build:
      context: ../
      dockerfile: Dockerfile
    profiles:
      - prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --forwarded-allow-ips "*"
    ports:
      - "${BACKEND_WSGI_BIND_IP:-${BIND_IP}}:${WSGI_PORT}:8000"
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - ENV_FILE=.env
      - RUN_MIGRATIONS=true
    depends_on:
      pgbouncer:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - shared_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "${ETL_DOMAIN:-dummy-local-host}:${LOCAL_DNS_ROUTING_IP:-127.0.0.1}"

  # 1b. Production Django ASGI Server (Daphne)
  backend-asgi:
    image: voicebot-backend-prod:latest
    profiles:
      - prod
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "${BACKEND_ASGI_BIND_IP:-${BIND_IP}}:${ASGI_PORT}:8000"
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - ENV_FILE=.env
    depends_on:
      pgbouncer:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      backend-wsgi:
        condition: service_healthy
    networks:
      - backend
      - shared_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "${ETL_DOMAIN:-dummy-local-host}:${LOCAL_DNS_ROUTING_IP:-127.0.0.1}"

  # 2b. Celery Worker (Production) — executes tasks
  celery-prod:
    image: voicebot-backend-prod:latest
    container_name: celery-prod-voicebot
    profiles:
      - prod
    command: celery -A config worker --loglevel=info
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - ENV_FILE=.env
    depends_on:
      pgbouncer:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      backend-wsgi:
        condition: service_healthy
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "${ETL_DOMAIN:-dummy-local-host}:${LOCAL_DNS_ROUTING_IP:-127.0.0.1}"

  # 2c. Celery Beat (Production) — enqueues CELERY_BEAT_SCHEDULE on time
  #
  # Run EXACTLY ONE beat instance per environment. A second one double-fires every
  # periodic task, so never scale or replicate this service. If prod ever spans more
  # than one host, beat belongs on exactly one of them.
  celery-beat-prod:
    image: voicebot-backend-prod:latest
    container_name: celery-beat-prod-voicebot
    profiles:
      - prod
    # --pidfile= disables the pid file on purpose: a restarted container reuses PID 1,
    # so a leftover pidfile looks like a live instance and beat refuses to start.
    command: celery -A config beat -l info --schedule=/var/lib/celery/celerybeat-schedule --pidfile=
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - ENV_FILE=.env
    volumes:
      # Named volume rather than ../.data/: the schedule DB must inherit the image's
      # django ownership (see the Dockerfile note on /var/lib/celery).
      - celery-beat-prod-schedule:/var/lib/celery
    depends_on:
      pgbouncer:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      backend-wsgi:
        condition: service_healthy
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "${ETL_DOMAIN:-dummy-local-host}:${LOCAL_DNS_ROUTING_IP:-127.0.0.1}"

volumes:
  # Persisted so restarts resume the existing cadence instead of restarting every timer.
  celery-beat-prod-schedule:
