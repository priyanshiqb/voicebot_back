services:
  # 3. PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: postgres-voicebot
    profiles:
      - database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../.data/postgres:/var/lib/postgresql
    ports:
      - "${POSTGRES_BIND_IP:-${BIND_IP}}:${DB_PORT:-5579}:5432"
    restart: always
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      retries: 5
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. PgBouncer Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-voicebot
    profiles:
      - pgbouncer
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      LOG_CONNECTIONS: "1"
      LOG_DISCONNECTIONS: "1"
      STATS_PERIOD: "86400"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: always
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "postgres" ]
      interval: 10s
      retries: 5
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9c. Postgres Metrics Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-voicebot
    profiles:
      - pgexporter
    # Split into URI / USER / PASS rather than one DATA_SOURCE_NAME: inside a DSN a
    # password containing @ / # : must be URL-encoded, and Azure-generated ones often
    # do. Defaults reach the local postgres container; see .env.example 1.5 for Azure.
    environment:
      DATA_SOURCE_URI: "${POSTGRES_EXPORTER_HOST:-postgres}:${POSTGRES_EXPORTER_PORT:-5432}/${POSTGRES_DB}?sslmode=${POSTGRES_EXPORTER_SSLMODE:-disable}"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # The landing page, not /metrics: a scrape runs queries against the database,
    # and whether Postgres is up is PostgresDown's job, not this container's.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9187/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
