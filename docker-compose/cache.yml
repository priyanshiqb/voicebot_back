services:
  # 6. Redis Caching & Channels Layer
  redis:
    image: redis:latest
    container_name: redis-voicebot
    profiles:
      - caches
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru" ]
    volumes:
      - ../.data/redis:/data
    ports:
      - "${REDIS_BIND_IP:-${BIND_IP}}:${REDIS_EXTERNAL_PORT}:6379"
    restart: always
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 7. Redis Insights Web UI
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight-voicebot
    profiles:
      - redis-insight
    ports:
      - "${REDIS_INSIGHT_BIND_IP:-${BIND_IP}}:${REDIS_INSIGHT_PORT}:5540"
    volumes:
      - ../.data/redisinsight:/data
    depends_on:
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5540/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9d. Redis Metrics Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-voicebot
    profiles:
      - redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      # Length of the Celery broker queue (the `celery` list in db2, see
      # CELERY_BROKER_URL) as redis_key_size{db="db2",key="celery"}: tasks waiting
      # for a worker. The only Celery backlog signal there is; the db2 key count is
      # not it, since result keys live in db2 too.
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: "db2=celery"
    # The image is the redis_exporter binary alone, no shell or wget, so the
    # healthcheck runs busybox from the probe-tools volume (see the loki service in
    # monitoring.yml). /health answers without touching Redis.
    volumes:
      - probe-tools:/probe:ro
    depends_on:
      redis:
        condition: service_healthy
        required: false
      probe-tools:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "--spider", "http://127.0.0.1:9121/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
