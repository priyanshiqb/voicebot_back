[project]
name = "voicebot-back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.5",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "django-filter>=25.2",
    "drf-spectacular>=0.28.0",
    "django-cors-headers>=4.7.0",
    "django-environ>=0.11.2",
    # Billing cycles are calendar arithmetic, not 30-day arithmetic: a subscription
    # starting 31 Jan renews 28 Feb, and twelve monthly cycles land on the same
    # calendar day each year rather than drifting five days. Already present
    # transitively via celery — declared here because Subscription imports it directly.
    "python-dateutil>=2.9.0",
    "gunicorn>=23.0.0",
    "uvicorn[standard]>=0.34.0",
    "daphne>=4.1.2",
    "channels>=4.1.0",
    "channels-redis>=4.2.0",
    "psycopg2-binary>=2.9.9",
    "razorpay>=2.0.1",
    "django-defender>=0.9.8",
    "django-redis>=6.0.0",
    "django-two-factor-auth>=1.17.0",
    "qrcode>=8.0.1",
    "django-prometheus>=2.5.0",
    "celery>=5.6.3",
    "django-storages[azure]>=1.14.6",
    "whitenoise>=6.12.0",
    "django-import-export>=4.4.1",
    "openpyxl>=3.1.5",
    "tablib>=3.9.0",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.198.0",
    "cryptography>=48.0.0",
    "firebase-admin>=7.5.0",
    "phonenumbers>=8.13",
    "charset-normalizer>=3.4",
    # Explicit, not transitive: zoneinfo falls back to the system tz database, which
    # slim container images omit. Without this ZoneInfo() raises ZoneInfoNotFoundError
    # and every availability lookup fails. Bumping it changes DST data — re-run
    # `manage.py audit_timezone_offsets` after any lockfile refresh.
    "tzdata>=2026.3",
    "azure-storage-blob>=12.24",
    "disposable-email-domains>=0.0.246",
]

