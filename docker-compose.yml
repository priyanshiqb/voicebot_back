services:
  # 1a. Production Django WSGI Server (Gunicorn)
  backend-wsgi:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - prod
    command: gunicorn config.wsgi:application --workers 4 --threads 4 --bind 0.0.0.0:8000
    ports:
      - "${BIND_IP}:${WSGI_PORT}:8000"
    env_file:
      - .env.shared
      - .env.django.docker
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 1b. Production Django ASGI Server (Daphne)
  backend-asgi:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - prod
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "${BIND_IP}:${ASGI_PORT}:8000"
    env_file:
      - .env.shared
      - .env.django.docker
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Future Scaling Tuning:
    # To scale open file descriptors for high WebSocket concurrency (e.g., 10k+ connections), add:
    # ulimits:
    #   nofile:
    #     soft: 65536
    #     hard: 65536
    # Note: Django Channels idle memory overhead is ~15-30KB per connection (10k connections ≈ 300MB RAM).

  # 2. Local Development Django Backend Server (Daphne with Hot-Reloading)
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - dev
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "${BIND_IP}:${DAPHNE_PORT}:8000"
    env_file:
      - .env.shared
      - .env.django.docker
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.local}
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: postgres-voicebot
    profiles:
      - databases
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    ports:
      - "${BIND_IP}:${DB_PORT}:5432"
    restart: always
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      retries: 5
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. PgBouncer Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-voicebot
    profiles:
      - databases
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "postgres"]
      interval: 10s
      retries: 5
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. Database Admin Web UI (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-voicebot
    profiles:
      - databases
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ./.data/pgadmin:/var/lib/pgadmin
    ports:
      - "${BIND_IP}:${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 6. Redis Caching & Channels Layer
  redis:
    image: redis:latest
    container_name: redis-voicebot
    profiles:
      - caches
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru" ]
    volumes:
      - ./.data/redis:/data
    ports:
      - "${BIND_IP}:${REDIS_EXTERNAL_PORT}:6379"
    restart: always
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 7. Redis Insights Web UI
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight-voicebot
    profiles:
      - caches
    ports:
      - "${BIND_IP}:${REDIS_INSIGHT_PORT}:5540"
    volumes:
      - ./.data/redisinsight:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 8. Grafana Dashboard UI
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-voicebot
    profiles:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "${BIND_IP}:${GRAFANA_PORT}:3000"
    depends_on:
      - loki
    volumes:
      - ./.data/grafana:/var/lib/grafana
      - ./docker-config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./docker-config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./docker-config/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9. Grafana Loki (Log Aggregator)
  loki:
    image: grafana/loki:latest
    container_name: loki-voicebot
    profiles:
      - monitoring
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-720h}
    volumes:
      - ./docker-config/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./.data/loki:/loki
    ports:
      - "${BIND_IP}:${LOKI_PORT}:3100"
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9b. Promtail (Log Collector & Shipper)
  promtail:
    image: grafana/promtail:latest
    container_name: promtail-voicebot
    profiles:
      - monitoring
    volumes:
      - ./docker-config/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9c. Postgres Metrics Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-voicebot
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9d. Redis Metrics Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-voicebot
    profiles:
      - monitoring
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 10. Prometheus Time-Series Database
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-voicebot
    profiles:
      - monitoring
    volumes:
      - ./docker-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${BIND_IP}:${PROMETHEUS_PORT}:9090"
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 11. Azurite Azure Storage Emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite-voicebot
    profiles:
      - emulators
    volumes:
      - ./.data/azurite:/data
    ports:
      - "${BIND_IP}:${AZURITE_BLOB_PORT}:10000"
      - "${BIND_IP}:${AZURITE_QUEUE_PORT}:10001"
      - "${BIND_IP}:${AZURITE_TABLE_PORT}:10002"
    command: azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    restart: always
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 12. Caddy Reverse Proxy (API Gateway)
  caddy:
    image: caddy:2.7-alpine
    container_name: caddy-voicebot
    profiles:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - WSGI_HOST=${WSGI_HOST}
      - ASGI_HOST=${ASGI_HOST}
      - ACME_EMAIL=${ACME_EMAIL}
      - GATEWAY_BASIC_AUTH_USER=${GATEWAY_BASIC_AUTH_USER}
      - GATEWAY_BASIC_AUTH_PASSWORD_HASH=${GATEWAY_BASIC_AUTH_PASSWORD_HASH}
    volumes:
      - ./docker-config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker-config/html:/var/www/html:ro
      - ./.data/caddy/data:/data
      - ./.data/caddy/config:/config
    networks:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
