global:
  # 15s, not 60s. Prometheus needs at least two samples inside a rate() window to
  # produce a value, so a 60s interval made every `rate(...[1m])` panel render
  # "No data" — the dashboard's 5m-window panels were the only ones that worked.
  # Dashboard rate() windows are literal (2m/5m) and assume this value; the Grafana
  # datasource pins the same number as jsonData.timeInterval.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Loki internal metrics (handy for health)
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Grafana internal metrics (optional but useful)
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Django Local Dev Metrics
  - job_name: django-dev
    metrics_path: /prom-metrics/metrics
    static_configs:
      - targets: ["backend-dev:8000"]

  # Django Prod WSGI Metrics
  - job_name: django-prod-wsgi
    metrics_path: /prom-metrics/metrics
    static_configs:
      - targets: ["backend-wsgi:8000"]

  # Django Prod ASGI Metrics
  - job_name: django-prod-asgi
    metrics_path: /prom-metrics/metrics
    static_configs:
      - targets: ["backend-asgi:8000"]

  # PostgreSQL Metrics via Exporter
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis Metrics via Exporter
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Per-container CPU / memory / network / disk
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host CPU / memory / disk / load
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
