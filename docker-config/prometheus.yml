global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Loki internal metrics (handy for health)
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Grafana internal metrics (optional but useful)
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Django Local Dev Metrics
  - job_name: django-dev
    metrics_path: /prom-metrics/
    static_configs:
      - targets: ["backend-dev:8000"]

  # Django Prod WSGI Metrics
  - job_name: django-prod-wsgi
    metrics_path: /prom-metrics/
    static_configs:
      - targets: ["backend-wsgi:8000"]

  # Django Prod ASGI Metrics
  - job_name: django-prod-asgi
    metrics_path: /prom-metrics/
    static_configs:
      - targets: ["backend-asgi:8000"]

  # PostgreSQL Metrics via Exporter
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis Metrics via Exporter
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
