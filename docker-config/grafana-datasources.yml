apiVersion: 1

# Runs before `datasources` on every boot, so both are re-created with the uids
# below. A grafana.db from before the uids were pinned holds these names under
# auto-generated uids, and provisioning then fails with "data source not found"
# and Grafana crash-loops. The dashboards reference the uids, not the numeric ids.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Must match global.scrape_interval in docker-config/prometheus.yml. Without it
      # Grafana assumes a default and can pick a query step finer than the real scrape
      # rate, which yields gappy graphs and makes $__rate_interval resolve to a window
      # too short for rate() to return anything.
      timeInterval: 15s
  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
