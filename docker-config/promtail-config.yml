server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Map the discovered container name (removing leading slash) to container label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Set the job name to match the container name for ease of filtering
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'job'

      # Map Docker Compose service name to service_name label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service_name'

    pipeline_stages:
      # Drop PgBouncer healthcheck connection logs to avoid database/loki log clutter
      - drop:
          expression: ".*login attempt: db=postgres user=postgres.*"
