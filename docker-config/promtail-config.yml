server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep ONLY the three Django backend containers, ignoring postgres, redis, caddy etc.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(backend-wsgi-voicebot|backend-asgi-voicebot|backend-dev-voicebot)'
        action: keep

      # Map the discovered container name (removing leading slash) to container label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Set the job name to match the container name for ease of filtering
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'job'
