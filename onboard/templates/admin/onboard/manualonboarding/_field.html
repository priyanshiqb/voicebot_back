{# One form row in the admin's aligned layout. Expects `field` (a BoundField). #}
<div class="form-row{% if field.errors %} errors{% endif %} field-{{ field.name }}">
  {{ field.errors }}
  {% if field.widget_type == "checkbox" %}
    <div class="checkbox-row">{{ field }}{{ field.label_tag }}</div>
  {% else %}
    <div class="flex-container">{{ field.label_tag }}{{ field }}</div>
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
</div>
