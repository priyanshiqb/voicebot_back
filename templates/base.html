<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secure Authentication - Voicebot{% endblock %}</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        /* Glassmorphic Container Card */
        .container-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            text-align: left;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1, h2, h3 {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Form Inputs */
        input[type="text"], input[type="password"], input[type="email"], input[type="number"], input[type="tel"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 0;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        /* Hidden Elements */
        [hidden], input[type="submit"][hidden] {
            display: none !important;
        }

        /* Table forms */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        th {
            padding: 0.5rem 0.5rem 0.5rem 0;
            vertical-align: middle;
            text-align: left;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.9rem;
            width: 30%;
        }

        td {
            padding: 0.5rem 0;
            vertical-align: middle;
            width: 70%;
        }

        /* Buttons & Submits */
        .btn, button, input[type="submit"] {
            display: inline-block;
            width: 100%;
            padding: 0.85rem 1.5rem;
            background: var(--primary);
            border: none;
            border-radius: 0.5rem;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            text-align: center;
        }

        .btn:hover, button:hover, input[type="submit"]:hover {
            background: var(--primary-hover);
        }

        .btn:active, button:active, input[type="submit"]:active {
            transform: scale(0.98);
        }

        .btn-secondary, button.btn-secondary {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-main) !important;
        }

        .btn-secondary:hover, button.btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15) !important;
        }

        /* Wizard actions wrapper styling */
        .wizard-actions {
            display: flex;
            flex-direction: row-reverse;
            gap: 1rem;
            margin-top: 2rem;
            width: 100%;
        }

        .wizard-actions .btn, .wizard-actions button {
            flex: 1;
            margin: 0;
        }

        .wizard-actions .btn-cancel {
            display: block;
            text-align: center;
            width: 100%;
            margin-top: 1.25rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Lists & items */
        ul {
            list-style-type: none;
            margin: 1.5rem 0;
        }

        li {
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            transition: background-color 0.2s;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .errorlist {
            color: #f87171;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .errorlist li {
            background: rgba(248, 113, 113, 0.1);
            border-color: rgba(248, 113, 113, 0.2);
        }
    </style>
    {% block extra_media %}{% endblock %}
</head>
<body>
    <div class="container-card">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
